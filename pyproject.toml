[project]
name = "bloomy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117.1",
    "psycopg[binary]>=3.2,<4.0",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.ruff.lint.isort]
known-first-party = ["main", "store"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["backend"]
pythonVersion = "3.12"
