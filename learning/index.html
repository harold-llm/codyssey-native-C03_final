<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="꽃피다 Bloomy — 아이가 배우고, 부모가 함께하는 영어 학습" />
  <title>Bloomy · 꽃피다</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#" data-nav="home" aria-label="Bloomy 홈">
        <span class="brand-mark">🌷</span>
        <span class="brand-name">Bloomy</span>
      </a>
      <nav class="nav" aria-label="주요 메뉴">
        <button class="nav-link" data-nav="today">오늘의 학습</button>
        <button class="nav-link" data-nav="myplan">학습 계획</button>
        <button class="nav-link" data-nav="report">리포트</button>
      </nav>
      <div class="header-actions">
        <button id="themeToggle" class="icon-btn" type="button" aria-label="다크 모드 전환" title="다크 모드 전환">
          <span class="theme-icon">🌙</span>
        </button>
        <button id="accountBtn" class="icon-btn" type="button" aria-label="계정" title="계정">
          <span>👤</span>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-brand">🌷 Bloomy · 꽃피다</p>
      <p class="footer-note">
        영어는 '증서'가 아니라 <strong>영어로 사고하는 사람</strong>을 키우는 여정이에요.
        코칭 메시지는 AI가 작성하며, 발달 진단과 효과 보장은 하지 않습니다.
      </p>
    </div>
  </footer>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
